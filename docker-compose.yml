services:
  monitor:
    build: .
    container_name: force-push-monitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - fpdata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gitlab-monitor:
    build: .
    container_name: force-push-monitor-gitlab
    restart: unless-stopped
    env_file: .env
    entrypoint:
      - python
      - gitlab_event_monitor.py
      - --db-file
      - /data/force_push_commits.sqlite3
      - --scan
    volumes:
      - fpdata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fpdata:
